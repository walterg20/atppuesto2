schema: spec-driven

context: |
  Replatforming del sistema legacy GeneXus 18 (KB `ATPPuestos`) hacia una arquitectura
  desacoplada: Backend Java 17 + Spring Boot 3.x (API REST) y Frontend Angular 17+ Standalone.

  Alcance y guardarraíles (ver openspec/constitution/):
  - La KB GeneXus legacy es SOLO LECTURA (prohibido compilar/modificar/eliminar objetos).
  - Spec-Driven Development: no hay código de aplicación sin spec aprobada en openspec/features/<modulo>/.
  - Paridad de BD: reutilizar el esquema SQL Server existente preservando nombres exactos
    de tabla y columna con @Table(name=...) y @Column(name=...).
  - Sin secretos en el repo; credenciales solo por variables de entorno.
  - Documentos y specs en español; sintaxis de requisitos EARS; norma ISO/IEC 25030.
  - Archivos de configuración por debajo de 500 líneas.

  Estructura de specs de ESTE proyecto (además de la nativa de OpenSpec):
    openspec/constitution/   -> reglas del stack y del proceso
    openspec/features/<modulo>/{spec.md, plan.md, tasks.md}

  Contexto de la KB (F0): ver docs/analisis-ATPPuestos.md
  - Ambiente único: `Gen18`, generador "Default (Java)".
  - BD de metadatos KB: GX_KB_ATPPuestos @ WALTERG20\SQLEXPRESS2019 (Integrated Security).
  - BD de la aplicación: `Rentas` @ devmssqlatp.ecom.com.ar (sin credenciales almacenadas).
  - Nombres físicos de tabla legacy (8 chars) != nombres lógicos de transacción.

rules:
  tasks:
    - Toda tarea debe ser verificable y referenciar el requisito EARS que implementa.
    - Tareas de máximo medio día; usar casillas `- [ ]`.

operations:
  apply:
    guidance:
      - Respetar el orden de tasks.md y actualizar el progreso al cerrar cada tarea.
  archive:
    guidance:
      - Resumir el resultado del módulo (cobertura, paridad, pruebas) antes de archivar.
